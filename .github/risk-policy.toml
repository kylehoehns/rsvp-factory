# How much review a PR needs. See docs/adr/0003-risk-tiers-for-a-single-maintainer.md.
#
# The risk-gate workflow reads this file from the BASE branch, never from the PR, so a PR
# can't loosen the rules that judge it. Changing this file is itself high risk.
#
# Tiers:   low    -> all checks green, then auto-merge
#          medium -> the maintainer approves the head commit
#          high   -> the maintainer approves, plus a second independent AI review and the slow suite
#
# A PR's tier is the highest floor any rule below puts it at. Anything no rule mentions is medium.
# Paths are fnmatch globs where "*" also matches "/".

maintainers = ["kylehoehns"]
# The factory's GitHub App. Its PRs are trusted like the maintainer's.
factory_bot = "rsvp-factory-bot[bot]"

[low]
# Every changed file must match one of these, and none of the exclusions, and the PR must be small.
paths = ["docs/*", "*.md"]
exclude = ["AGENTS.md", "CLAUDE.md", "GLOSSARY.md", "docs/adr/*", "docs/agents/*", ".agents/*"]
max_changed_lines = 100
# A PR that only adds tests is low at any size: it changes no production code, so it can only add
# coverage. Editing or deleting a test line is not "only adds" and stays medium.
test_paths = ["app/src/test/*", "acceptance/src/test/*"]
# A PR is also low when the independent second opinion passed its head commit (it matches the ticket and
# CODING_STANDARDS.md, with no blocker or one-way door) and it changes little production code. Tests don't
# count toward the limit. A later commit the second opinion hasn't read loses the pass until it runs again.
# High paths, edits to existing acceptance scenarios, outside authors and one-way doors still raise the tier.
reviewed_production_paths = ["app/src/main/*"]
reviewed_max_production_lines = 200

[high]
# The identity module, schema changes, and the factory's own controls.
paths = [
    "app/src/main/java/dev/rsvpfactory/identity/*",
    "app/src/main/resources/db/migration/*",
    ".github/*",
    ".factory/*",
    ".agents/*",
    ".claude/*",
    ".githooks/*",
    "scripts/*",
    "build-logic/*",
    "gradle/*",
    "*.gradle.kts",
    "gradle.properties",
    "gradlew",
    "gradlew.bat",
]

[medium]
# Changing or deleting anything already in the acceptance suite (adding new files is ordinary work).
# ADR 0002: the slow suite also runs main's scenarios against the PR, and a failure there is high.
existing_paths = ["acceptance/*"]
