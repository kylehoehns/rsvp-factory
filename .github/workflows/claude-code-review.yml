# The high tier's independent second opinion (ADR 0003). Runs when a PR gets the `claude-review` label:
# the factory adds it to every PR it opens in the high tier, and the maintainer can add it to any PR.
#
# Independent means a different job from the factory's own reviewer (our coding standards, commits fixes):
# a security brief, comments only, a capped number of turns. Sonnet keeps usage modest, since most early tickets
# add migrations and land in the high tier; set --model to claude-opus-5-5 for a stronger (pricier) opinion. A
# different vendor is more independent still: to use GitHub Copilot, request it as a reviewer here instead.
name: second-review

on:
  pull_request:
    types: [labeled]

jobs:
  second-review:
    if: github.event.label.name == 'claude-review' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Second opinion (security brief)
        uses: anthropics/claude-code-action@a5a423f75c251dcbff8a74e99f83b2cb03c72bfa # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The factory app adds the label to its own high-tier PRs; the action refuses bot-started runs
          # unless the bot is named here. Only our app, never '*'.
          allowed_bots: rsvp-factory-bot
          prompt: |
            You are the independent second reviewer for pull request ${{ github.repository }}#${{ github.event.pull_request.number }}.
            It is in the high risk tier: it touches identity, the database schema, or the factory's own controls.
            Another reviewer has already checked coding standards and the spec; don't repeat that work.

            Read the diff with `gh pr diff ${{ github.event.pull_request.number }}` and the description with
            `gh pr view ${{ github.event.pull_request.number }}`. Then look only for what could go wrong in production:
            - Who can do what: defaults that make something public, missing permission checks, data one member can
              see or change that belongs to another.
            - Personal data: member details exposed in responses, logs or errors.
            - Schema and migrations: anything hard to undo, data that could be lost, constraints that will bite later.
            - Secrets and credentials: anything that would be unsafe in a public repository.

            Post each real problem as an inline comment on the line it's about, saying what could happen and what
            you'd change. Then post one summary comment on the PR that starts with "Second opinion (security)"
            and either lists the problems or says plainly that you found none. Don't approve or request changes:
            the maintainer decides.
          claude_args: >-
            --model claude-sonnet-5-5 --max-turns 15
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"
