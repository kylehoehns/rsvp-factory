# The required `ci` check: every brake that runs in minutes.
# Runs on pull_request only (never pull_request_target), so fork PRs get no secrets and a read-only token.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Check (format, compile, null-safety, tests, architecture)
        run: ./gradlew check

      - name: Generated module docs are committed
        run: |
          if ! git diff --exit-code -- docs/modules; then
            echo "::error::docs/modules is stale. Run ./gradlew check locally and commit docs/modules."
            exit 1
          fi

      - name: Mutation-test the classes this PR changed
        if: github.event_name == 'pull_request'
        run: |
          targets=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- 'app/src/main/java/**/*.java' \
            | sed -E 's#app/src/main/java/##; s#\.java$##; s#/#.#g' | grep -v 'package-info$' | paste -sd, - || true)
          if [[ -z "$targets" ]]; then
            echo "No production classes changed; skipping PIT."
            exit 0
          fi
          ./gradlew :app:pitest -PpitTargets="$targets"

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: '**/build/reports/'
          retention-days: 7
