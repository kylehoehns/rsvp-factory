# The required `ci` check: every brake that runs in minutes.
# Runs on pull_request only (never pull_request_target), so fork PRs get no secrets and a read-only token.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Repo scripts behave as documented (risk gate, file token limit, dispatcher)
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 -m unittest discover -s .factory -p 'test_*.py'

      - name: Type-check and test the factory orchestrator
        working-directory: .factory/sandcastle
        run: npm ci --silent && npm run typecheck && npm test

      - name: Lint workflows and shell scripts (the factory's own controls)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          docker run --rm -v "$PWD:/mnt" koalaman/shellcheck@sha256:bb596a0d169b85ddd81d8b6d3a2ff6d5baf5fca10b97f575ebc647c3dff62b3d \
            .factory/sandcastle/setup-keychain.sh .claude/hooks/guard-paths.sh .claude/hooks/guard-bash.sh \
            .claude/hooks/format-java.sh .githooks/pre-commit

      - name: Check (format, compile, null-safety, tests, architecture)
        run: ./gradlew check

      - name: Generated module docs are committed
        run: |
          if ! git diff --exit-code -- docs/modules; then
            echo "::error::docs/modules is stale. Run ./gradlew check locally and commit docs/modules."
            exit 1
          fi

      - name: Mutation-test the classes this PR changed
        if: github.event_name == 'pull_request'
        run: |
          targets=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- 'app/src/main/java/**/*.java' \
            | sed -E 's#app/src/main/java/##; s#\.java$##; s#/#.#g' | grep -v 'package-info$' | paste -sd, - || true)
          if [[ -z "$targets" ]]; then
            echo "No production classes changed; skipping PIT."
            exit 0
          fi
          # Production code without tests in app/ scores 0% here and fails the build.
          ./gradlew :app:pitest -PpitTargets="$targets" -PpitThreshold=60

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: '**/build/reports/'
          retention-days: 7
